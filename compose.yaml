name: proxy-stack
x-tool: &tool
  image: ${TOOL_IMAGE:-ghcr.io/silaswei-io/proxy-stack:v1.0.0}
  build:
    context: .
    dockerfile: manager/Dockerfile
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=64m,mode=1777"]
  environment:
    DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    NODE_NAME: ${NODE_NAME:-}
    HOST_NODE_NAME: ${HOST_NODE_NAME:-}
    PUBLIC_PORT: ${PUBLIC_PORT:-443}
    HTTP01_ONLY: ${HTTP01_ONLY:-false}
    MODE: ${MODE:-standalone}
    CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    UPDATE_INTERVAL: ${UPDATE_INTERVAL:-86400}
    ROLE: ${ROLE:-hub}
    LOCAL_NODE: ${LOCAL_NODE:-true}
    LEASE_SECONDS: ${LEASE_SECONDS:-300}
services:
  manager:
    <<: *tool
    profiles: [tools]
    volumes: &state
      - ./data/model:/data/model
      - ./data/runtime:/data/runtime
      - ./data/public:/data/public
      - ./data/cache:/data/cache
      - ./data/locks:/data/locks
  updater:
    <<: *tool
    command: [serve]
    restart: unless-stopped
    stop_grace_period: 45s
    volumes:
      - ./data/model:/data/model:ro
      - ./data/public:/data/public
      - ./data/cache:/data/cache
      - ./data/locks:/data/locks
    healthcheck:
      test: [CMD, python, -m, proxy_stack.cli, health]
      interval: 60s
      timeout: 10s
      retries: 3
  hub:
    <<: *tool
    command: [hub-api]
    restart: unless-stopped
    stop_grace_period: 20s
    volumes: *state
  xray:
    <<: *tool
    command: [runtime]
    restart: unless-stopped
    stop_grace_period: 20s
    volumes: *state
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.4@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52}
    command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${PUBLIC_PORT:-443}:${PUBLIC_PORT:-443}"
    volumes:
      - ./data/runtime/caddy:/etc/caddy:ro
      - ./data/public:/srv/public:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [xray]
volumes:
  caddy_data:
  caddy_config:
networks:
  default:
    driver: bridge
