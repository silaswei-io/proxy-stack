[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-stack"
version = "0.1.0"
description = "Personal Docker Compose VLESS/WSS subscription manager"
requires-python = ">=3.9"
dependencies = ["PyYAML==6.0.3"]
license = "MIT"

[project.scripts]
proxy-stack = "proxy_stack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proxy_stack = ["bootstrap.json"]
