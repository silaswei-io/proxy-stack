name: release-tool
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: release-tool-v1.0.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'silaswei-io/proxy-stack' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test before publication
        run: |
          docker build -t proxy-stack-tool:v1.0.0 -f manager/Dockerfile .
          docker run --rm --entrypoint python -v "$PWD/tests:/tests:ro" proxy-stack-tool:v1.0.0 -m unittest discover -s /tests -v
          sudo python3 tests/integration/run.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: manager/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/silaswei-io/proxy-stack:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/silaswei-io/proxy-stack
            org.opencontainers.image.version=v1.0.0
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Advance v1.0.0 only for the current main revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current" != "$EXPECTED_SHA" ]; then
            echo "A newer main revision exists; immutable revision retained, v1.0.0 unchanged."
            exit 0
          fi
          docker buildx imagetools create --tag ghcr.io/silaswei-io/proxy-stack:v1.0.0 \
            "ghcr.io/silaswei-io/proxy-stack:sha-$EXPECTED_SHA"
